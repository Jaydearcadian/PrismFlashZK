# Makes contracts/solidity a self-contained Foundry project. The .sol files live directly
# in this directory (kept here so server.ts's contract inspector can read them by path), so
# src = "." tells forge to compile them in place instead of the default ./src.
[profile.default]
src = "."
out = "out"
libs = []
optimizer = true
optimizer_runs = 200
# BaseEscrow.sol / PrismToken.sol are pragma ^0.8.20 with no external imports.
